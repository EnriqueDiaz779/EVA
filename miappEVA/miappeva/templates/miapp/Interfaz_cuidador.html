{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVA - Panel Cuidador</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fuente Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFF8E1;

    <span class="text-xl md:text-2xl font-extrabold text-white tracking-wide">EVA</span>

  <main class="text-center">

    <a href="{% url 'salir' %}" class="mt-8 inline-block bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition">
      Salir
    </a>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 h-4 bg-blue-900"></footer>

</html>
