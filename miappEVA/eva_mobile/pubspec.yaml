name: eva_mobile
description: "Proyecto EVA móvil"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  android_intent_plus: ^5.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/eva.png
    - assets/images/eva.jpg
    - assets/images/microfono11.png
    - assets/images/medicamento.png
    - assets/images/alarmaBoton.png
