name: eva_mobile
description: "Proyecto EVA móvil"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1
  android_intent_plus: ^5.3.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/eva.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/eva.png
    - assets/images/eva.jpg
    - assets/images/microfono11.png
    - assets/images/medicamento.png
    - assets/images/alarmaBoton.png
    - assets/images/sos_boton.png
    - assets/images/chat_boton.png
